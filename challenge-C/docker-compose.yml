services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${MODEL:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      -c 4096 --parallel 2 -t 4
      --jinja
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 6g
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      - CATALOG_RESET_INTERVAL_S=900
      - SESSION_TTL_S=14400
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - LLM_URL=http://llm:8080
      - BACKEND_URL=http://backend:9200
      - RATE_LIMIT_WINDOW_S=60
      - RATE_LIMIT_MAX_REQUESTS=10
      - COOKIE_SECURE=0
      - SESSION_TTL_S=14400
      - DEBUG_RETRIEVAL_TRACE=0
      - MAX_ANSWER_TOKENS=40
    depends_on:
      - llm
      - backend
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

networks:
  internal: