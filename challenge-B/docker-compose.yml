services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${MODEL:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0 --port 8080
      -c 4096 --parallel 2 -t 4
      --jinja
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 6g
    restart: unless-stopped
    # Nessuna porta esposta all'host: raggiungibile solo da 'api'.

  backend:
    build: ./backend
    environment:
      # Ogni quanti secondi i ticket vengono azzerati (vedi main.py).
      - TICKET_RESET_INTERVAL_S=900
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    # Nessuna porta esposta all'host: raggiungibile solo da 'api'.

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      - LLM_URL=http://llm:8080
      - BACKEND_URL=http://backend:9100
      - RATE_LIMIT_WINDOW_S=60
      - RATE_LIMIT_MAX_REQUESTS=10
      # Token massimi per ogni chiamata al modello nel loop dell'agente.
      - MAX_AGENT_TOKENS=60
      - DEBUG_AGENT_TRACE=0
    depends_on:
      - llm
      - backend
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

networks:
  internal:
