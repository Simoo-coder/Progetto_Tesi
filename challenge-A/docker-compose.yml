services:

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/${MODEL:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      -c 4096
      --parallel 2
      -t 4
      --jinja
    networks:
      - internal
    mem_limit: 6g
    cpus: 4
    restart: unless-stopped

  renderer-image:
    image: mind-renderer:local
    build:
      context: ./renderer
    profiles:
      - build-only

  supervisor:
    image: mind-supervisor:local
    build:
      context: ./supervisor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      RENDER_TIMEOUT_S: "20"
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN non configurato nel file .env}
    networks:
      - internal
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_URL: http://llm:8080
      RENDERER_URL: http://supervisor:9000
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN:?SUPERVISOR_TOKEN non configurato nel file .env}
      RATE_LIMIT_WINDOW_S: "60"
      RATE_LIMIT_MAX_REQUESTS: "10"
      MAX_REPORT_TOKENS: "90"
    depends_on:
      - llm
      - supervisor
    networks:
      - internal
      - frontend
    mem_limit: 256m
    cpus: 1
    pids_limit: 128
    restart: unless-stopped

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge